# The POC side of the stack: the collector the apps talk to, and Grafana on top of SigNoz.
# SigNoz itself runs from signoz/compose.yaml (start that first: it creates the signoz-network used below).
services:
  collector:                 # receives traces, metrics and logs from the browser/backend on :4318, forwards them to SigNoz
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otel.yaml"]
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SIGNOZ_OTLP_ENDPOINT: ${SIGNOZ_OTLP_ENDPOINT:-signoz-ingester:4317}
    volumes:
      - ./otel-collector.yaml:/etc/otel.yaml
    ports:
      - "${COLLECTOR_HTTP_PORT:-4318}:4318"   # OTLP/HTTP (the browser sends here)
    networks: [default, signoz-network]

  grafana:                   # dashboards on top of SigNoz's ClickHouse store  http://localhost:3001
    image: grafana/grafana:13.2.4
    environment:             # POC ONLY: no login. Never expose this.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource       # downloaded on first start (needs internet)
    volumes:
      - ./infra/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./infra/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"          # 3001 because the demo backend uses 3000
    networks: [default, signoz-network]

networks:
  signoz-network:
    external: true
    name: signoz-network     # created by signoz/compose.yaml
